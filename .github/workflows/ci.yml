name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm audit --audit-level=high
      - name: Run tests (no Gemini key, emulator mode)
        env:
          FIREBASE_EMULATOR: 'true'
          NODE_ENV: 'test'
        run: npm test
