<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citizen Sign In — CivicResolve</title>
  <meta name="theme-color" content="#1D4ED8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrapper {
      max-width: 440px;
      margin: var(--space-8) auto;
      padding: 0 var(--space-4);
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: var(--space-8) var(--space-6);
      box-shadow: var(--shadow-md);
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: var(--space-6) 0;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-light);
    }
    .divider span {
      padding: 0 var(--space-3);
    }
  </style>
</head>
<body>
  <header class="gov-header">
    <div class="top-bar">
      <a class="brand" href="index.html#home">
        <div class="brand-emblem">CR</div>
        <div class="brand-text">Civic<span>Resolve</span></div>
      </a>
      <div class="lang-selector">
        <select id="lang-select" class="lang-select" aria-label="Select language">
          <option value="en">English</option>
          <option value="hi">हिन्दी (Hindi)</option>
          <option value="ta">தமிழ் (Tamil)</option>
          <option value="te">తెలుగు (Telugu)</option>
          <option value="bn">বাংলা (Bengali)</option>
          <option value="mr">मराठी (Marathi)</option>
          <option value="gu">ગુજરાતી (Gujarati)</option>
          <option value="kn">ಕನ್ನಡ (Kannada)</option>
          <option value="ml">മലയാളം (Malayalam)</option>
          <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
          <option value="ur">اردو (Urdu)</option>
        </select>
      </div>
    </div>
  </header>

  <main class="auth-wrapper" id="main" tabindex="-1">
    <div class="auth-card">
      <h2>Citizen Sign In</h2>
      <p style="font-size:0.95rem;">Sign in to register grievances, follow official status updates, and view your grievance history.</p>

      <!-- Google Sign In -->
      <button type="button" class="btn btn-secondary" id="btn-google-signin" style="width:100%;margin-bottom:var(--space-2);">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="margin-inline-end:8px;">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
      </button>

      <div class="divider">
        <span>OR VIA PHONE OTP</span>
      </div>

      <!-- Phone Sign In -->
      <form id="phone-form" novalidate>
        <div class="form-group" id="step-phone">
          <label class="form-label" for="phone-number">Mobile Number</label>
          <input type="tel" id="phone-number" class="form-input" placeholder="+91 98765 43210" required autocomplete="tel">
          <span class="form-hint">Enter your 10-digit Indian phone number</span>
          <button type="submit" class="btn btn-primary" id="btn-send-otp" style="width:100%;margin-top:var(--space-3);">Send OTP</button>
        </div>

        <div class="form-group" id="step-otp" style="display:none;">
          <label class="form-label" for="otp-code">Enter 6-Digit OTP</label>
          <input type="text" id="otp-code" class="form-input" placeholder="123456" maxlength="6" inputmode="numeric">
          <div style="display:flex;gap:var(--space-2);margin-top:var(--space-3);">
            <button type="button" class="btn btn-secondary" id="btn-back-phone" style="flex:1;">Change Number</button>
            <button type="button" class="btn btn-primary" id="btn-verify-otp" style="flex:1;">Verify & Sign In</button>
          </div>
        </div>

        <div id="recaptcha-container"></div>
      </form>

      <div id="auth-error" class="form-error" style="margin-top:var(--space-4);" role="alert"></div>

      <div style="margin-top:var(--space-6);padding-top:var(--space-4);border-top:1px solid var(--border-light);text-align:center;">
        <p style="font-size:0.9rem;margin-bottom:0;">
          Want to track an existing ticket without signing in?<br>
          <a href="index.html#track">Search ticket reference</a>
        </p>
      </div>
    </div>
  </main>

  <script src="auth-client.js"></script>
  <script>
    const authErr = document.getElementById('auth-error');
    const btnGoogle = document.getElementById('btn-google-signin');
    const phoneForm = document.getElementById('phone-form');
    const stepPhone = document.getElementById('step-phone');
    const stepOtp = document.getElementById('step-otp');
    const btnVerifyOtp = document.getElementById('btn-verify-otp');
    const btnBackPhone = document.getElementById('btn-back-phone');

    btnGoogle.addEventListener('click', async () => {
      authErr.textContent = '';
      btnGoogle.disabled = true;
      try {
        await window.AuthClient.signInWithGoogle();
        window.location.href = 'index.html#report';
      } catch (err) {
        authErr.textContent = err.message || 'Google sign-in failed.';
        btnGoogle.disabled = false;
      }
    });

    phoneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authErr.textContent = '';
      const phone = document.getElementById('phone-number').value.trim();
      if (!phone) {
        authErr.textContent = 'Please enter a valid mobile number.';
        return;
      }
      try {
        await window.AuthClient.signInWithPhone(phone);
        stepPhone.style.display = 'none';
        stepOtp.style.display = 'block';
      } catch (err) {
        authErr.textContent = err.message || 'Failed to send OTP.';
      }
    });

    btnVerifyOtp.addEventListener('click', async () => {
      authErr.textContent = '';
      const code = document.getElementById('otp-code').value.trim();
      if (code.length < 6) {
        authErr.textContent = 'Please enter the complete 6-digit code.';
        return;
      }
      try {
        await window.AuthClient.confirmOTP(code);
        window.location.href = 'index.html#my-reports';
      } catch (err) {
        authErr.textContent = err.message || 'Invalid verification code.';
      }
    });

    btnBackPhone.addEventListener('click', () => {
      stepOtp.style.display = 'none';
      stepPhone.style.display = 'block';
      authErr.textContent = '';
    });
  </script>
</body>
</html>
