<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CivicResolve — Civic Grievance Redressal Platform</title>
  <meta name="description" content="Municipal civic grievance portal for reporting infrastructure issues, potholes, sanitation, and tracking official resolution.">
  <meta name="theme-color" content="#1D4ED8">

  <!-- Preconnect to Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231D4ED8'/%3E%3Cpath d='M9 16l5 5 10-11' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="gov-header" role="banner">
    <div class="top-bar">
      <a class="brand" href="#home" aria-label="CivicResolve Home">
        <div class="brand-emblem" aria-hidden="true">CR</div>
        <div class="brand-text">Civic<span>Resolve</span></div>
      </a>

      <nav aria-label="Primary Navigation" id="nav">
        <ul class="nav-links">
          <li><a href="#home" data-i18n="nav.home">Home</a></li>
          <li><a href="#report" data-i18n="nav.report">Report Issue</a></li>
          <li><a href="#track" data-i18n="nav.track">Track Issue</a></li>
          <li><a href="#my-reports" data-i18n="nav.myReports">My Reports</a></li>
          <li><a href="#how-it-works" data-i18n="nav.howItWorks">How It Works</a></li>
          <li><a href="#privacy" data-i18n="nav.privacy">Privacy</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <div class="lang-selector">
          <label for="lang-select" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">Choose Language</label>
          <select id="lang-select" class="lang-select" aria-label="Select language">
            <option value="en">English</option>
            <option value="as">অসমীয়া (Assamese)</option>
            <option value="bn">বাংলা (Bengali)</option>
            <option value="brx">बड़ो (Bodo)</option>
            <option value="doi">डोगरी (Dogri)</option>
            <option value="gu">ગુજરાતી (Gujarati)</option>
            <option value="hi">हिन्दी (Hindi)</option>
            <option value="kn">ಕನ್ನಡ (Kannada)</option>
            <option value="ks">کٲشُر (Kashmiri)</option>
            <option value="kok">कोंकणी (Konkani)</option>
            <option value="mai">मैथिली (Maithili)</option>
            <option value="ml">മലയാളം (Malayalam)</option>
            <option value="mni">মৈতৈলোন্ (Manipuri)</option>
            <option value="mr">मराठी (Marathi)</option>
            <option value="ne">नेपाली (Nepali)</option>
            <option value="or">ଓଡ଼ିଆ (Odia)</option>
            <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
            <option value="sa">संस्कृतम् (Sanskrit)</option>
            <option value="sat">ᱥᱟᱱᱛᱟᱲᱤ (Santali)</option>
            <option value="sd">سنڌي (Sindhi)</option>
            <option value="ta">தமிழ் (Tamil)</option>
            <option value="te">తెలుగు (Telugu)</option>
            <option value="ur">اردو (Urdu)</option>
          </select>
        </div>

        <div id="nav-auth">
          <a href="login.html" class="btn btn-secondary btn-sm" id="btn-login-nav" data-i18n="nav.signIn">Sign In</a>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="main-container" tabindex="-1" role="main" aria-live="polite">
    <!-- Dynamic SPA content injected here by app.js -->
  </main>

  <footer class="gov-footer" role="contentinfo">
    <div class="main-container" style="padding-top:0;padding-bottom:0;">
      <p style="margin-bottom:8px;">CivicResolve — Municipal Grievance Redressal and Operations System</p>
      <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0;">Compliant with WCAG 2.2 AA accessibility standards. Deployed on Google Cloud Run.</p>
    </div>
  </footer>

  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-container"></div>

  <!-- Scripts -->
  <script src="auth-client.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
